# 园区光纤环网拓扑工作台
#
# 启动页面：
#   docker compose up --build -d web
#   （页面端口可用 WEB_PORT 覆盖，默认 8080，例如 WEB_PORT=9000 docker compose up web）
#
# 一次性验收（运行 Vitest 删边预言机与规模/性能测试，结束即退出）：
#   docker compose --profile verify run --build --rm verify

services:
  web:
    build:
      context: .
      target: web
    image: fiber-ring-workbench-web
    ports:
      # 宿主机端口可通过环境变量 WEB_PORT 覆盖，容器内固定监听 80
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

  verify:
    # 一次性验收服务：只跑测试，不发布端口；退出码 0 即验收通过
    profiles:
      - verify
    build:
      context: .
      target: verify
    image: fiber-ring-workbench-verify
    restart: "no"
